schema_version: 1
name: development
workflow_version: 0.9.1
initial_status: backlog
requires_secrets: [GITHUB_TOKEN]
# AUTO_MERGE: "true" lets the review watch merge the pull request itself once
# every check and commit status of the verified head succeeded and nothing
# needs the developer. Enable it per queue with
# `ttasks queue env set QUEUE AUTO_MERGE true`; the queue value overrides this
# default. Only "true" and "false" are valid. GITHUB_TOKEN then needs
# permission to merge, and the repository must allow merge commits.
env:
    AUTO_MERGE: "false"
limits:
    idle_iterations: 3
    rejected_requests: 5
    script_failures: 3
    unavailable_grace: 5m
artifacts:
    - name: plan
      description: The implementation plan, as Markdown.
    - name: branch
      description: Name of the task's branch, the pull request's head.
    - name: verification
      description: Verification on the pull request's head commit, as Markdown, with its full SHA.
    - name: pull_request
      description: URL of the pull request for this task.
    - name: merge_commit
      description: Merge commit recorded by the monitor.
    - name: rework
      description: >-
        The customer's request for more work, as Markdown. Set it while the task is in review to send the task back to implement at the next watch run.
statuses:
    - id: backlog
      owner: customer
      instructions: ./statuses/backlog.md
      transitions:
        - {on: start, to: plan}
    - id: plan
      owner: {pool: developers}
      instructions: ./statuses/plan.md
      transitions:
        - on: planned
          to: approval
          requires: [plan]
          checks:
            - script: ./scripts/plan-check.py
              timeout: 30s
              description: The plan has its four sections, how it works, steps, verification and limitations, each with content.
    - id: approval
      owner: customer
      instructions: ./statuses/approval.md
      transitions:
        - {on: approved, to: implement}
        - {on: changes_requested, to: plan}
    - id: implement
      owner: {pool: developers}
      instructions: ./statuses/implement.md
      limits: {idle_iterations: 6}
      transitions:
        - on: ready
          to: review
          requires: [pull_request, branch, verification]
          checks:
            - script: ./scripts/pr-open.py
              timeout: 60s
              description: The pull request is open or merged from the branch at the verified head commit, targets the default branch, and its text does not name the task key.
    - id: review
      owner: script
      watch:
        script: ./scripts/pr-monitor.py
        every: 120s
        timeout: 60s
        description: Waits for the merge, or merges when AUTO_MERGE is true and all checks passed; reports the customer's rework, review feedback, a merge conflict, or failed checks and requested changes.
      limits: {script_failures: 10}
      transitions:
        - {on: merged, to: complete}
        - {on: rework, to: implement}
        - {on: review_feedback, to: implement}
        - {on: conflict, to: implement}
        - {on: changes_requested, to: implement}
    - id: complete
      owner: {pool: developers}
      instructions: ./statuses/complete.md
      transitions:
        - on: cleaned
          to: done
          checks:
            - script: ./scripts/merged-on-base.py
              run_as: agent
              description: The merge commit is on the local base branch, and the task's worktree and branch are gone.
    - id: done
      terminal: true
